name: Update Location Order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-location:
    if: "!contains(github.event.head_commit.message, 'Update location order')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Change location order
        run: |
          sed -i 's/Bhopal, Delhi and Pune/Delhi, Bhopal and Pune/g' index.html
          sed -i 's/Bhopal • Delhi • Pune/Delhi • Bhopal • Pune/g' index.html
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No location-order change needed."
          else
            git commit -m "Update location order"
            git push
          fi
