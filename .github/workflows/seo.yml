name: Validate SEO files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate SEO essentials
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path(".")
          required = ["index.html", "robots.txt", "sitemap.xml"]
          for name in required:
              if not (root / name).exists():
                  raise SystemExit(f"Missing required SEO file: {name}")
          index = (root / "index.html").read_text(encoding="utf-8")
          checks = [
              ('<meta name="robots" content="index,follow,max-image-preview:large">', "robots meta"),
              ('rel="canonical"', "canonical"),
              ('application/ld+json', "structured data"),
              ('<meta name="description"', "meta description"),
          ]
          for needle, label in checks:
              if needle not in index:
                  raise SystemExit(f"Missing {label} in index.html")
          robots = (root / "robots.txt").read_text(encoding="utf-8")
          if "Sitemap: https://gyanendraconsultancy-cyber.github.io/gyanendra-consultancy/sitemap.xml" not in robots:
              raise SystemExit("robots.txt does not reference the sitemap")
          sitemap = (root / "sitemap.xml").read_text(encoding="utf-8")
          if "https://gyanendraconsultancy-cyber.github.io/gyanendra-consultancy/" not in sitemap:
              raise SystemExit("sitemap.xml does not contain the homepage")
          print("SEO validation passed.")
